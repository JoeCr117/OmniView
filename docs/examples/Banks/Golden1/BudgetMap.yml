# Example budget map ("transaction map") for a bank named Golden1.
#
# This is SYNTHETIC sample data - every merchant, amount and account below is
# invented. It exists to document the file format; the real budget map is
# private and git-ignored (see docs/examples/README.md).
#
# Shape, top to bottom:
#
#   Category:                      # top-level spending group
#     Budget: <number>             # optional monthly budget for the category
#     SubCategories:
#       SubCategory:
#         Budget: <number>         # optional; must not exceed the parent's
#         Type:                    # free-form grouping, carried through to gold
#           Type Name:
#             Label:               # the human-readable payee/merchant
#               - STRING MATCH     # matched by containment against Description
#               - ANOTHER MATCH    # a label may have any number of matches
#
# Notes that matter when authoring one of these:
#   - Matching is case-sensitive string CONTAINMENT against a transaction's
#     Description, and FIRST MATCH WINS (see banks/bank.py _map_categories).
#     Order broader matches after narrower ones.
#   - Quote any match containing a `#`, `:` or leading/trailing spaces, or YAML
#     will mis-parse it (e.g. "ATM FEE WITHDRAWAL Trace #1234").
#   - `Budget` is optional. Categories that only classify money movement
#     (Income, Banking, transfers) normally omit it.
#   - A subcategory budget may never exceed its parent category's budget - the
#     dbt data test tests/Budgets/CatToSubCatSums.sql fails the build if it does.
#   - CategorySK is hashed from (Category, SubCategory), so renaming either one
#     re-keys the row downstream.

