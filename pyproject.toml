[project]
name = "omniview"
version = "0.1.0"
description = "OmniView: a multi-app dashboard shell. ExpenseTracker parses transaction CSVs, sets budgets and analyzes history."
readme = "README.md"
# <3.14: Databricks Apps uv mode takes the newest allowed interpreter, and
# 3.14 forces a pydantic-core source build there (no wheel) that PyO3 rejects.
requires-python = ">=3.13,<3.14"
dependencies = [
    "databricks-sdk>=0.120.0",
    "dbt-core>=1.10.6",
    "dbt-postgres>=1.9.1",
    "django>=6.0.7",
    "django-allauth[socialaccount]>=65.18.0",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.6.2",
    "gunicorn>=26.0.0",
    "ipykernel>=6.30.0",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    # Measurement and gates - see quality/README.md for what each one holds.
    "import-linter>=2.0",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "ruff>=0.9",
]

[tool.ruff]
# 100, not ruff's 88: at 88 the existing code has 259 long lines, at 100 it has
# 61. The number describes this codebase rather than reformatting it.
line-length = 100
# Generated by Django, not written here.
extend-exclude = ['**/migrations/*']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
# Only rule families this codebase already satisfies. Anything that would need a
# sweeping edit to adopt is listed as backlog in quality/README.md with its
# measured count, so the debt is visible instead of hidden behind a loose config.
select = ['E4', 'E7', 'E9', 'F', 'I', 'UP', 'B', 'SIM', 'RUF']
ignore = [
    # Django's `Meta`, `AppConfig` and model fields are all mutable class
    # attributes by design; ClassVar-annotating them fights the framework.
    'RUF012',
    # `payload: dict = Body(...)` and `file: UploadedFile = File(...)` ARE the
    # django-ninja calling convention - a bare `dict` binds as a query parameter
    # instead (see CLAUDE.md). The rule is right about Python and wrong here.
    'B008',
    # The four below are matters of taste, not defects, and adopting them would
    # rewrite readable code to satisfy a preference. Measured counts at adoption:
    # RUF005 4, SIM108 2, SIM103 1, SIM117 1, UP047 1.
    'RUF005',
    'SIM108',
    'SIM103',
    'SIM117',
    'UP047',
]

[tool.mypy]
ignore_missing_imports = true
exclude = ['.*/migrations/.*']

[tool.coverage.run]
source = ['backend', 'pipelines']
omit = [
    '*/migrations/*',
    '*/tests/*',
    '*/conftest.py',
    # Runs only inside a Databricks App; nothing in the fast tier reaches it.
    '*/config/pg_lakebase/*',
]

[tool.coverage.report]
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError']
# Measured at adoption, not chosen. Raise it when coverage rises; never lower it
# to make a run pass - that is the whole point of the number being here.
fail_under = 82

[tool.ruff.lint.flake8-quotes]
# Measured, not chosen: 248 string literals deviate from single, 3,738 from double.
inline-quotes = 'single'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# backend/ so Django's apps import as `config`/`shell`/`apps.*` (matching how
# manage.py runs); "." so the suite can also see `pipelines` - the schema
# contract test asserts the two sides still agree on table names.
pythonpath = ["backend", "."]
# pipelines is listed so the bank-parser tests are collected. The pipelines are
# not importable from backend; pythonpath's "." is what makes pipelines.* resolve.
testpaths = ["backend", "pipelines"]
# Setting norecursedirs REPLACES pytest's defaults, so the defaults are restated
# here alongside dbt's generated output.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "target", "logs", "dbt_packages",
]
