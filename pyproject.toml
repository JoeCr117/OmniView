[project]
name = "omniview"
version = "0.1.0"
description = "OmniView: a multi-app dashboard shell. ExpenseTracker parses transaction CSVs, sets budgets and analyzes history."
readme = "README.md"
# <3.14: Databricks Apps uv mode takes the newest allowed interpreter, and
# 3.14 forces a pydantic-core source build there (no wheel) that PyO3 rejects.
requires-python = ">=3.13,<3.14"
dependencies = [
    "databricks-sdk>=0.120.0",
    "dbt-core>=1.10.6",
    "dbt-postgres>=1.9.1",
    "django>=6.0.7",
    "django-allauth[socialaccount]>=65.18.0",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.6.2",
    "gunicorn>=26.0.0",
    "ipykernel>=6.30.0",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# backend/ so Django's apps import as `config`/`shell`/`apps.*` (matching how
# manage.py runs); "." so the suite can also see `pipelines` - the schema
# contract test asserts the two sides still agree on table names.
pythonpath = ["backend", "."]
# pipelines is listed so the bank-parser tests are collected. The pipelines are
# not importable from backend; pythonpath's "." is what makes pipelines.* resolve.
testpaths = ["backend", "pipelines"]
# Setting norecursedirs REPLACES pytest's defaults, so the defaults are restated
# here alongside dbt's generated output.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "target", "logs", "dbt_packages",
]
